# breathe-easy-td (https://breathe-easy-td.netlify.app/)
# Publish /td only. Never publish the repo root (that would serve /schedule as TD).
# Copy shared/ into the publish tree so live-jobs.js can load Firestore.
# Booking is a separate Netlify site: https://breathe-easy-booking.netlify.app/ (publish schedule/).

[build]
  command = "rm -rf td/shared && mkdir -p td/shared && cp -R shared/. td/shared/"
  publish = "td"

# Chrome Install requires a JSON manifest MIME type, not octet-stream.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
